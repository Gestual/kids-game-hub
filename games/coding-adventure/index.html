<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coding Adventure - Kids Game Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Background space stars -->
        <div id="stars-layer"></div>

        <!-- Headers -->
        <div id="hud">
            <button class="hub-back-btn" onclick="HubAPI.close()">← BACK</button>
            <div id="level-indicator">MISSION: <span id="current-level">1</span></div>
            <div id="timer-badge">⏱️ <span id="time-left">60</span></div>
        </div>

        <div id="board-layout">
            <!-- Left Side: Map Grid -->
            <div id="grid-card" class="card">
                <h2 class="title">SPACE GRID</h2>
                <div id="play-grid"></div>
            </div>

            <!-- Right Side: Programming Panel -->
            <div id="program-card" class="card">
                <h2 class="title">COMMANDS</h2>
                <div id="toolbox">
                    <div class="cmd-block" draggable="true" data-cmd="forward" style="border-color: #00ff88;">
                        <span class="icon">➡️</span> Move Forward
                    </div>
                    <div class="cmd-block" draggable="true" data-cmd="left" style="border-color: #00f2ff;">
                        <span class="icon">↩️</span> Turn Left
                    </div>
                    <div class="cmd-block" draggable="true" data-cmd="right" style="border-color: #7000ff;">
                        <span class="icon">↪️</span> Turn Right
                    </div>
                    <div class="cmd-block" draggable="true" data-cmd="loop2" style="border-color: #ffd93d;">
                        <span class="icon">🔄</span> Repeat x2
                    </div>
                </div>

                <h2 class="title" style="margin-top: 20px;">MY PROGRAM</h2>
                <div id="timeline">
                    <!-- Dropped commands go here -->
                    <div class="timeline-placeholder">Drag commands here!</div>
                </div>

                <div class="controls-row">
                    <button id="btn-run" class="btn primary" onclick="runProgram()">RUN ▶️</button>
                    <button id="btn-reset" class="btn secondary" onclick="resetLevel()">RESET 🔄</button>
                </div>
            </div>
        </div>

        <!-- Success overlay -->
        <div id="success-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="modal-title">MISSION COMPLETE! 🏆</h2>
                <p id="modal-msg">You guided the space robot back to the portal!</p>
                <div id="rewards">+15 XP | +10 Coins</div>
                <button class="btn primary" onclick="nextLevel()">NEXT MISSION</button>
            </div>
        </div>

        <!-- Failure notification -->
        <div id="failure-toast" class="toast hidden">CRASHED! Try resetting the level. 💥</div>
    </div>

    <!-- Hub API integration -->
    <script>
        const HubAPI = {
            addXP(amount) {
                if (window.parent && window.parent.Hub) {
                    window.parent.postMessage({ type: 'addXP', amount: amount }, '*');
                }
            },
            close() {
                if (window.parent && window.parent.Hub) {
                    window.parent.postMessage({ type: 'closeGame' }, '*');
                }
            },
            complete(xp, coins) {
                if (window.parent && window.parent.Hub) {
                    window.parent.postMessage({ type: 'game_complete', xp: xp, coins: coins }, '*');
                }
            }
        };
    </script>
    <script src="game.js"></script>
</body>
</html>
