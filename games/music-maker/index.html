<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beat Sandbox - Kids Game Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- HUD Header -->
        <div id="hud">
            <button class="hub-back-btn" onclick="HubAPI.close()">← BACK</button>
            <div id="title-text">BEAT SANDBOX 🎵</div>
            <div id="controls-panel">
                <button id="btn-play" class="btn-ctrl primary" onclick="togglePlay()">PLAY ▶️</button>
                <button class="btn-ctrl secondary" onclick="clearGrid()">CLEAR 🗑️</button>
                <div class="bpm-control">
                    <span>SPEED:</span>
                    <select id="bpm-select" onchange="updateBPM()">
                        <option value="100">100 BPM (Chill)</option>
                        <option value="120" selected>120 BPM (Medium)</option>
                        <option value="140">140 BPM (Fast!)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Chord Progression & Arp Control Bar -->
        <div id="progression-panel">
            <div class="chord-progression">
                <span>CHORDS:</span>
                <div class="chord-select-group">
                    <div class="chord-item">
                        <label>BEAT 1-4</label>
                        <select id="chord-select-0" class="chord-select" onchange="updateChords()">
                            <option value="C" selected>C Major</option>
                            <option value="G">G Major</option>
                            <option value="Am">A Minor</option>
                            <option value="F">F Major</option>
                            <option value="Dm">D Minor</option>
                            <option value="Em">E Minor</option>
                            <option value="Bb">Bb Major</option>
                        </select>
                    </div>
                    <div class="chord-item">
                        <label>BEAT 5-8</label>
                        <select id="chord-select-1" class="chord-select" onchange="updateChords()">
                            <option value="C">C Major</option>
                            <option value="G">G Major</option>
                            <option value="Am" selected>A Minor</option>
                            <option value="F">F Major</option>
                            <option value="Dm">D Minor</option>
                            <option value="Em">E Minor</option>
                            <option value="Bb">Bb Major</option>
                        </select>
                    </div>
                    <div class="chord-item">
                        <label>BEAT 9-12</label>
                        <select id="chord-select-2" class="chord-select" onchange="updateChords()">
                            <option value="C">C Major</option>
                            <option value="G">G Major</option>
                            <option value="Am">A Minor</option>
                            <option value="F" selected>F Major</option>
                            <option value="Dm">D Minor</option>
                            <option value="Em">E Minor</option>
                            <option value="Bb">Bb Major</option>
                        </select>
                    </div>
                    <div class="chord-item">
                        <label>BEAT 13-16</label>
                        <select id="chord-select-3" class="chord-select" onchange="updateChords()">
                            <option value="C">C Major</option>
                            <option value="G" selected>G Major</option>
                            <option value="Am">A Minor</option>
                            <option value="F">F Major</option>
                            <option value="Dm">D Minor</option>
                            <option value="Em">E Minor</option>
                            <option value="Bb">Bb Major</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="arp-control">
                <span>ARPEGGIATOR:</span>
                <select id="arp-select" onchange="updateArp()">
                    <option value="off" selected>Off (Harmony)</option>
                    <option value="up">Up 📈</option>
                    <option value="down">Down 📉</option>
                    <option value="bounce">Bounce 🔀</option>
                </select>
            </div>
        </div>

        <!-- Page Switcher Bar -->
        <div id="page-controls">
            <button class="page-btn active" id="page-btn-0" onclick="setPage(0)">Page 1 (Steps 1-16)</button>
            <button class="page-btn" id="page-btn-1" onclick="setPage(1)">Page 2 (Steps 17-32)</button>
            <button class="page-btn" id="page-btn-2" onclick="setPage(2)">Page 3 (Steps 33-48)</button>
            <button class="page-btn" id="page-btn-3" onclick="setPage(3)">Page 4 (Steps 49-64)</button>
        </div>

        <!-- Sequencer Grid -->
        <div id="sequencer-card" class="card">
            <div id="labels-column">
                <select id="instrument-row-0" class="instrument-select" style="border-left: 5px solid #ff0055;" onchange="changeRowInstrument(0)">
                    <option value="chime" selected>🌟 Chime</option>
                    <option value="sine">🎹 Sine Synth</option>
                    <option value="square">🕹️ Retro Synth</option>
                    <option value="saw">⚡ Buzz Synth</option>
                    <option value="triangle">🎸 Bass Synth</option>
                    <option value="kick">🥁 Kick Drum</option>
                    <option value="snare">🥁 Snare Drum</option>
                    <option value="hihat">✨ Hi-Hat</option>
                    <option value="cymbal">💥 Cymbal</option>
                    <option value="cowbell">🔔 Cowbell</option>
                    <option value="laser">🔫 Retro Laser</option>
                    <option value="warp">Alien Warp</option>
                </select>
                <select id="instrument-row-1" class="instrument-select" style="border-left: 5px solid #ff92ad;" onchange="changeRowInstrument(1)">

                    <option value="chime">🌟 Chime</option>
                    <option value="sine" selected>🎹 Sine Synth</option>
                    <option value="square">🕹️ Retro Synth</option>
                    <option value="saw">⚡ Buzz Synth</option>
                    <option value="triangle">🎸 Bass Synth</option>
                    <option value="kick">🥁 Kick Drum</option>
                    <option value="snare">🥁 Snare Drum</option>
                    <option value="hihat">✨ Hi-Hat</option>
                    <option value="cymbal">💥 Cymbal</option>
                    <option value="cowbell">🔔 Cowbell</option>
                    <option value="laser">🔫 Retro Laser</option>
                    <option value="warp">Alien Warp</option>
                </select>
                <select id="instrument-row-3" class="instrument-select" style="border-left: 5px solid #00ff88;" onchange="changeRowInstrument(3)">
                    <option value="chime">🌟 Chime</option>
                    <option value="sine" selected>🎹 Sine Synth</option>
                    <option value="square">🕹️ Retro Synth</option>

                    <option value="triangle">🎸 Bass Synth</option>
                    <option value="kick">🥁 Kick Drum</option>

                    <option value="hihat">✨ Hi-Hat</option>
                    <option value="cymbal">💥 Cymbal</option>
                    <option value="cowbell">🔔 Cowbell</option>
                    <option value="laser">🔫 Retro Laser</option>

                </select>
                <select id="instrument-row-4" class="instrument-select" style="border-left: 5px solid #ffd93d;" onchange="changeRowInstrument(4)">

                    <option value="cowbell">🔔 Cowbell</option>
                    <option value="laser">🔫 Retro Laser</option>
                    <option value="warp">Alien Warp</option>
                </select>
                <select id="instrument-row-5" class="instrument-select" style="border-left: 5px solid #e84393;" onchange="changeRowInstrument(5)">

                </select>
                <select id="instrument-row-6" class="instrument-select" style="border-left: 5px solid #7000ff;" onchange="changeRowInstrument(6)">
                    <option value="chime">🌟 Chime</option>
                    <option value="sine">🎹 Sine Synth</option>
                    <option value="square">🕹️ Retro Synth</option>
                    <option value="saw">⚡ Buzz Synth</option>
                    <option value="triangle">🎸 Bass Synth</option>
                    <option value="kick">🥁 Kick Drum</option>
                    <option value="snare" selected>🥁 Snare Drum</option>
                    <option value="hihat">✨ Hi-Hat</option>
                    <option value="cymbal">💥 Cymbal</option>
                    <option value="cowbell">🔔 Cowbell</option>

                    <option value="warp">Alien Warp</option>
                </select>
                <select id="instrument-row-7" class="instrument-select" style="border-left: 5px solid #ff9800;" onchange="changeRowInstrument(7)">
                    <option value="chime">🌟 Chime</option>
                    <option value="sine">🎹 Sine Synth</option>
                    <option value="square">🕹️ Retro Synth</option>

                    <option value="warp">Alien Warp</option>
                </select>
            </div>
            <div id="grid-container">
                <div id="sequencer-grid"></div>
            </div>
        </div>

        <!-- Footer actions -->
        <div id="actions-panel">
            <button class="btn-action" onclick="finishBeat()">SAVE BEAT & EARN REWARDS 💾</button>
        </div>
    </div>

    <!-- Hub API integration -->
    <script>
        const HubAPI = {
            close() {
                if (window.parent && window.parent.Hub) {
                    window.parent.postMessage({ type: 'closeGame' }, '*');
                }
            },
            complete(xp, coins) {
                if (window.parent && window.parent.Hub) {
                    window.parent.postMessage({ type: 'game_complete', xp: xp, coins: coins }, '*');
                }
            }
        };
    </script>
    <script src="game.js"></script>
</body>
</html>
